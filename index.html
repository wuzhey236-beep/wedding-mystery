
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>結婚式謎解き</title>
<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  min-height: 100vh;
  font-family: sans-serif;
  color: #fff;
  background: linear-gradient(135deg, #171923, #343044, #171923);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 24px 16px;
}
.card {
  width: 100%;
  max-width: 440px;
  text-align: center;
  padding: 30px 22px;
  border: 1px solid #c8aa72;
  border-radius: 18px;
  background: rgba(15, 16, 25, 0.92);
  box-shadow: 0 0 30px #0005;
}
.ornament {
  color: #d9bd83;
  letter-spacing: 5px;
  font-size: 13px;
}
h1 {
  color: #e6cc98;
  font-size: 28px;
  margin: 18px 0;
}
p {
  line-height: 1.9;
}
.paper {
  margin: 26px 0;
  display: flex;
  flex-direction: column;
  gap: 7px;
}
.strip {
  background: #fff9e9;
  color: #514535;
  min-height: 53px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  font-weight: bold;
  clip-path: polygon(
    0 5%, 8% 0, 15% 7%, 25% 1%, 34% 8%,
    44% 0, 54% 7%, 64% 1%, 75% 8%, 86% 0,
    100% 6%, 98% 92%, 88% 100%, 76% 93%,
    65% 100%, 54% 94%, 43% 100%, 31% 93%,
    20% 100%, 9% 94%, 0 100%
  );
}
input {
  width: 100%;
  padding: 15px;
  margin: 12px 0;
  border-radius: 9px;
  border: 1px solid #c8aa72;
  background: #fff;
  color: #222;
  font-size: 22px;
  text-align: center;
  letter-spacing: 5px;
}
button {
  width: 100%;
  padding: 15px;
  margin-top: 8px;
  border: none;
  border-radius: 9px;
  background: linear-gradient(135deg, #e7d1a0, #b99557);
  color: #211b15;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}
.message {
  min-height: 28px;
  color: #f0b4b4;
  margin-top: 12px;
}
.final h1 {
  font-size: 32px;
}
.final .message {
  color: #f3dca9;
  font-size: 17px;
}
.hidden {
  display: none;
}
</style>
</head>
<body>
<main class="card">
  <div class="ornament">✦ KOTA & REIKA ✦</div>

  <section id="page1">
    <h1>結婚式謎解き</h1>
    <p>バラバラになった紙の謎を解き、<br>次のページへ進もう。</p>

    <div class="paper">
      <div class="strip">ひらめきを信じて</div>
      <div class="strip">答えは４桁の数字</div>
      <div class="strip">謎を解き明かせ</div>
    </div>

    <p>４桁の数字を入力しなさい</p>
    <form id="form1">
      <input id="answer1" type="text"
        inputmode="numeric" maxlength="4"
        placeholder="0000" autocomplete="off" required>
      <button type="submit">答えを送信する</button>
    </form>
    <div class="message" id="message1" aria-live="polite"></div>
  </section>

  <section id="page2" class="hidden">
    <h1>第２の謎</h1>
    <p>会場に用意されたゲーム。</p>
    <p>そのゲームに必要な合計数を答えよ。</p>
    <form id="form2">
      <input id="answer2" type="number"
        placeholder="数字を入力" autocomplete="off" required>
      <button type="submit">答えを送信する</button>
    </form>
    <div class="message" id="message2" aria-live="polite"></div>
  </section>

  <section id="page3" class="hidden final">
    <div class="ornament">✦ CONGRATULATIONS ✦</div>
    <h1>おめでとうございます！</h1>
    <p>すべての謎を解き明かしました。</p>
    <p class="message">
      この画面をスクリーンショットして<br>
      新郎新婦のLINEに送信してね！
    </p>
    <div class="ornament">KOTA ♡ REIKA</div>
  </section>
</main>

<script>
document.getElementById("form1").addEventListener("submit", function(e) {
  e.preventDefault();

  const answer = document.getElementById("answer1").value.trim();

  if (answer === "2468") {
    document.getElementById("page1").classList.add("hidden");
    document.getElementById("page2").classList.remove("hidden");
  } else {
    document.getElementById("message1").textContent = "残念！もう一度考えてみよう。";
  }
});

document.getElementById("form2").addEventListener("submit", function(e) {
  e.preventDefault();

  const answer = document.getElementById("answer2").value.trim();

  if (answer === "16") {
    document.getElementById("page2").classList.add("hidden");
    document.getElementById("page3").classList.remove("hidden");
  } else {
    document.getElementById("message2").textContent =
      "残念。このゲームは2人でやるもの。";
  }
});
</script>
</body>
</html>
